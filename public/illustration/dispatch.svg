<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" fill="none">
  <defs>
    <linearGradient id="route" x1="280" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FB6E2"/>
      <stop offset="0.55" stop-color="#00478D"/>
      <stop offset="1" stop-color="#B61718"/>
    </linearGradient>
    <linearGradient id="sky" x1="80" y1="40" x2="880" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FAFE"/>
      <stop offset="1" stop-color="#EDF3FB"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1B33" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1B33" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#DCE7F3" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="960" height="600" rx="28" fill="url(#sky)"/>
  <rect width="960" height="600" rx="28" fill="url(#grid)"/>

  <ellipse cx="190" cy="150" rx="230" ry="150" fill="#E4EEFA" opacity="0.7"/>
  <ellipse cx="800" cy="500" rx="240" ry="150" fill="#E8F0FA" opacity="0.65"/>

  <!-- Hospital -->
  <g filter="url(#softShadow)">
    <rect x="86" y="196" width="204" height="232" rx="18" fill="#FFFFFF" stroke="#DCE7F3"/>
    <rect x="86" y="196" width="204" height="18" rx="9" fill="#EAF1FA"/>
    <rect x="163" y="236" width="50" height="50" rx="12" fill="#00478D"/>
    <path d="M188 247v28M174 261h28" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <rect x="112" y="316" width="38" height="26" rx="6" fill="#E8F1FB"/>
    <rect x="169" y="316" width="38" height="26" rx="6" fill="#E8F1FB"/>
    <rect x="226" y="316" width="38" height="26" rx="6" fill="#E8F1FB"/>
    <rect x="112" y="360" width="152" height="10" rx="5" fill="#EDF4FC"/>
    <rect x="112" y="382" width="96" height="10" rx="5" fill="#EDF4FC"/>
  </g>

  <!-- Clinic -->
  <g filter="url(#softShadow)">
    <rect x="686" y="232" width="188" height="196" rx="18" fill="#FFFFFF" stroke="#DCE7F3"/>
    <rect x="686" y="232" width="188" height="16" rx="8" fill="#EAF1FA"/>
    <circle cx="780" cy="286" r="24" fill="#EEF4FB" stroke="#D6E5F5"/>
    <path d="M780 274v24M768 286h24" stroke="#00478D" stroke-width="5" stroke-linecap="round"/>
    <rect x="712" y="330" width="42" height="26" rx="6" fill="#E8F1FB"/>
    <rect x="766" y="330" width="42" height="26" rx="6" fill="#E8F1FB"/>
    <rect x="820" y="330" width="30" height="26" rx="6" fill="#E8F1FB"/>
    <rect x="712" y="374" width="138" height="10" rx="5" fill="#EDF4FC"/>
    <rect x="712" y="396" width="88" height="10" rx="5" fill="#EDF4FC"/>
  </g>

  <!-- Route -->
  <path d="M286 344C380 344 392 244 480 244C568 244 580 344 686 344" stroke="#DCE9F7" stroke-width="14" stroke-linecap="round"/>
  <path d="M286 344C380 344 392 244 480 244C568 244 580 344 686 344" stroke="url(#route)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 16"/>

  <!-- Ambulance -->
  <g filter="url(#cardShadow)">
    <ellipse cx="524" cy="404" rx="132" ry="14" fill="#0B1B33" opacity="0.08"/>
    <rect x="424" y="300" width="196" height="92" rx="18" fill="#FFFFFF" stroke="#D6E4F2"/>
    <path d="M620 322h28c10 0 18 8 18 18v26c0 10-8 18-18 18h-28z" fill="#EEF4FB" stroke="#D6E4F2"/>
    <path d="M632 330h18c5 0 8 3 8 8v12h-26z" fill="#BFD8F2"/>
    <rect x="424" y="356" width="196" height="9" rx="4.5" fill="#B61718" opacity="0.92"/>
    <rect x="492" y="316" width="40" height="40" rx="11" fill="#00478D"/>
    <path d="M512 325v22M501 336h22" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <rect x="560" y="290" width="40" height="9" rx="4.5" fill="#B61718"/>
    <rect x="558" y="286" width="44" height="16" rx="8" fill="#B61718" opacity="0.16"/>
    <circle cx="466" cy="396" r="17" fill="#12304F"/>
    <circle cx="466" cy="396" r="7" fill="#E8F1FB"/>
    <circle cx="598" cy="396" r="17" fill="#12304F"/>
    <circle cx="598" cy="396" r="7" fill="#E8F1FB"/>
    <rect x="444" y="332" width="30" height="8" rx="4" fill="#E8F1FB"/>
  </g>

  <!-- Telemetry nodes -->
  <circle cx="286" cy="344" r="10" fill="#FFFFFF" stroke="#00478D" stroke-width="3"/>
  <circle cx="286" cy="344" r="3.5" fill="#00478D"/>
  <circle cx="686" cy="344" r="10" fill="#FFFFFF" stroke="#B61718" stroke-width="3"/>
  <circle cx="686" cy="344" r="3.5" fill="#B61718"/>

  <!-- Mission card -->
  <g filter="url(#cardShadow)">
    <rect x="596" y="96" width="262" height="112" rx="18" fill="#FFFFFF" stroke="#E3ECF7"/>
    <circle cx="622" cy="124" r="6" fill="#22A06B"/>
    <rect x="638" y="119" width="86" height="10" rx="5" fill="#DCE9F7"/>
    <rect x="618" y="146" width="182" height="9" rx="4.5" fill="#EDF4FC"/>
    <rect x="618" y="164" width="132" height="9" rx="4.5" fill="#EDF4FC"/>
    <rect x="618" y="182" width="64" height="8" rx="4" fill="#E4EEFA"/>
    <rect x="700" y="178" width="72" height="24" rx="12" fill="#EEF9F3"/>
    <circle cx="714" cy="190" r="4" fill="#22A06B"/>
    <rect x="724" y="186" width="36" height="8" rx="4" fill="#9CD9BC"/>
  </g>

  <!-- ETA card -->
  <g filter="url(#cardShadow)">
    <rect x="132" y="440" width="196" height="92" rx="18" fill="#FFFFFF" stroke="#E3ECF7"/>
    <rect x="154" y="462" width="70" height="9" rx="4.5" fill="#DCE9F7"/>
    <rect x="154" y="482" width="116" height="9" rx="4.5" fill="#EDF4FC"/>
    <rect x="154" y="502" width="48" height="14" rx="7" fill="#00478D"/>
    <rect x="210" y="502" width="60" height="14" rx="7" fill="#FBE3E3"/>
  </g>

  <!-- Accent cross -->
  <g opacity="0.9">
    <rect x="806" y="452" width="54" height="54" rx="14" fill="#FBE3E3"/>
    <path d="M833 466v26M820 479h26" stroke="#B61718" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
